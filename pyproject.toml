[project]
name = "aquila-agent"
version = "0.1.0"
description = "Aquila Agent — local terminal coding agent for LM Studio"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "rich>=13.7",
    "prompt_toolkit>=3.0",
    "duckduckgo-search>=6.2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.scripts]
aquila = "aquila.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aquila*"]
