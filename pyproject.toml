[project]
name = "lmcc"
version = "0.1.0"
description = "LMCC — Local Mode: Command & Conquer AI Agent Harness for LM Studio"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "rich>=13.7",
    "prompt_toolkit>=3.0",
    "duckduckgo-search>=6.2",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.scripts]
lmcc = "lmcc.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lmcc*"]
